<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Color Palette Generator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#0f172a;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:850px;
    background:#1e293b;
    padding:25px;
    border-radius:22px;
    color:white;
    text-align:center;
    box-shadow:0 0 25px rgba(0,0,0,0.4);
}

h2{
    margin-bottom:20px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#22c55e;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#16a34a;
}

.palette{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:15px;
    margin-top:25px;
}

.color{
    height:180px;
    border-radius:16px;
    position:relative;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
}

.color:hover{
    transform:scale(1.03);
}

.code{
    position:absolute;
    bottom:0;
    width:100%;
    background:rgba(0,0,0,0.4);
    padding:12px;
    color:white;
    font-weight:bold;
}

.info{
    margin-top:25px;
    background:#334155;
    padding:18px;
    border-radius:14px;
    line-height:1.8;
}

</style>
</head>

<body>

<div class="container">

    <h2>🎨 AI Color Palette Generator</h2>

    <button onclick="generatePalette()">
        Generate Palette
    </button>

    <div class="palette" id="palette"></div>

    <div class="info">

        Rang ustiga bossangiz HEX code copy bo‘ladi 📋

    </div>

</div>

<script>

function randomColor(){

    let letters =
    "0123456789ABCDEF";

    let color = "#";

    for(let i = 0; i < 6; i++){

        color +=
        letters[
            Math.floor(
                Math.random() * 16
            )
        ];
    }

    return color;
}

function generatePalette(){

    let palette =
    document.getElementById("palette");

    palette.innerHTML = "";

    for(let i = 0; i < 5; i++){

        let color =
        randomColor();

        palette.innerHTML += `
        
            <div
            class="color"
            style="background:${color}"
            onclick="copyColor('${color}')">

                <div class="code">

                    ${color}

                </div>

            </div>

        `;
    }
}

function copyColor(color){

    navigator.clipboard.writeText(color);

    alert(color + " copied ✅");
}

generatePalette();

</script>

</body>
</html>
